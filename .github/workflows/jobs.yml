name: Publish Gov Jobs

on:
  schedule:
    - cron: '30 6 * * *'   # يوميًا: يفحص بوابة الوظائف وينشر الجديد فقط
  workflow_dispatch:
    inputs:
      publish_mode:
        description: '📤 وضع النشر'
        type: choice
        default: 'نشر مباشر'
        options:
          - نشر مباشر
          - مسودة
      only_live:
        description: '🌐 الجديد من البوابة فقط (تخطي الملف المحفوظ)'
        type: boolean
        default: false
      dry_run:
        description: '🧪 تجربة فقط'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: blogger-jobs
  cancel-in-progress: false

jobs:
  jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Publish jobs
        env:
          BLOGGER_TOKEN: ${{ secrets.BLOGGER_TOKEN }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          PUBLISH_AS_DRAFT: ${{ (inputs.publish_mode == 'مسودة' && 'true') || 'false' }}
          INPUT_ONLY_LIVE: ${{ inputs.only_live || (github.event_name == 'schedule' && 'true') || 'false' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python -m src.jobs
      - name: Commit history
        if: always()
        run: |
          git config user.name "Auto Blogger Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data || true
          git diff --staged --quiet || git commit -m "chore: jobs history [skip ci]"
          git pull --rebase || true
          git push || true
