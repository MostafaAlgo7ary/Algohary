name: Publish Gov Jobs

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      publish_mode:
        description: '📤 وضع النشر'
        type: choice
        default: 'نشر مباشر'
        options:
          - نشر مباشر
          - مسودة
      dry_run:
        description: '🧪 تجربة فقط: لا تنشر'
        type: boolean
        default: false
      ignore_history:
        description: '♻️ تجاهل سجل الوظائف (ينشر الكل من جديد)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: blogger-jobs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install fonts (best effort)
        timeout-minutes: 6
        continue-on-error: true
        run: |
          if ! fc-list | grep -qi "noto"; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends fonts-noto-core fonts-dejavu-core || \
            (sudo apt-get update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends fonts-noto-core fonts-dejavu-core)
          fi

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run
        env:
          BLOGGER_TOKEN: ${{ secrets.BLOGGER_TOKEN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          PUBLISH_AS_DRAFT: ${{ (inputs.publish_mode == 'مسودة' && 'true') || 'false' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          INPUT_IGNORE_HISTORY: ${{ inputs.ignore_history || 'false' }}
          INPUT_ONLY_LIVE: ${{ (inputs.ignore_history && 'false') || 'true' }}
        run: python -m src.jobs

      - name: Commit history and images
        if: always()
        run: |
          git config user.name "Auto Blogger Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data images || true
          git diff --staged --quiet || git commit -m "chore: jobs history and images [skip ci]"
          git pull --rebase || true
          git push || true
