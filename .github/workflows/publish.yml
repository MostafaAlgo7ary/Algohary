name: Auto Blogger News

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      section:
        description: '📂 القسم'
        type: choice
        default: 'تناوب تلقائي'
        options:
          - تناوب تلقائي
          - كل الأقسام
          - رياضة
          - تقنية
          - ألعاب
          - سفر
          - فن
          - طعام
          - اقتصاد
      articles_per_run:
        description: '🔢 عدد المقالات (لكل قسم)'
        type: choice
        default: '1'
        options: ['1', '2', '3', '5']
      publish_mode:
        description: '📤 وضع النشر'
        type: choice
        default: 'حسب الإعدادات'
        options:
          - حسب الإعدادات
          - مسودة
          - نشر مباشر
      style:
        description: '✍️ أسلوب الكتابة'
        type: choice
        default: 'افتراضي'
        options:
          - افتراضي
          - مختصر
          - تحليلي
          - عاجل
      external_url:
        description: '🔗 رابط خبر خارجي لتحويله لمقال (اختياري)'
        type: string
        required: false
      custom_feed:
        description: '📡 رابط RSS أو صفحة أخبار بديل (اختياري)'
        type: string
        required: false
      source_filter:
        description: '📰 مصدر محدد مثل Btolat أو IGN (اختياري)'
        type: string
        required: false
      extra_labels:
        description: '🏷️ عدد التصنيفات الإضافية'
        type: choice
        default: '0'
        options: ['0', '1', '2', '3']
      dry_run:
        description: '🧪 تجربة فقط: اكتب ولا تنشر'
        type: boolean
        default: false
      ignore_history:
        description: '♻️ تجاهل السجل'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: blogger-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLOGGER_TOKEN: ${{ secrets.BLOGGER_TOKEN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          INPUT_SECTION: ${{ inputs.section || 'تناوب تلقائي' }}
          ARTICLES_PER_RUN: ${{ inputs.articles_per_run || vars.ARTICLES_PER_RUN || '1' }}
          PUBLISH_AS_DRAFT: ${{ (inputs.publish_mode == 'نشر مباشر' && 'false') || (inputs.publish_mode == 'مسودة' && 'true') || vars.PUBLISH_AS_DRAFT || 'true' }}
          INPUT_STYLE: ${{ inputs.style || 'افتراضي' }}
          INPUT_EXTERNAL_URL: ${{ inputs.external_url }}
          INPUT_CUSTOM_FEED: ${{ inputs.custom_feed }}
          INPUT_SOURCE_FILTER: ${{ inputs.source_filter }}
          EXTRA_LABELS: ${{ inputs.extra_labels || '0' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          INPUT_IGNORE_HISTORY: ${{ inputs.ignore_history || 'false' }}
        run: python main.py

      - name: Commit state and images
        if: always()
        run: |
          git config user.name "Auto Blogger Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data images || true
          git diff --staged --quiet || git commit -m "chore: update history, state and images [skip ci]"
          git pull --rebase || true
          git push || true
