name: Auto Blogger News

on:
  schedule:
    # 7 تشغيلات يوميًا (بتوقيت UTC) = مقال لكل قسم يوميًا تقريبًا
    - cron: '0 4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blogger-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLOGGER_TOKEN: ${{ secrets.BLOGGER_TOKEN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          PUBLISH_AS_DRAFT: ${{ vars.PUBLISH_AS_DRAFT || 'true' }}
          ARTICLES_PER_RUN: ${{ vars.ARTICLES_PER_RUN || '1' }}
        run: python main.py

      - name: Commit state and images
        if: always()
        run: |
          git config user.name "Auto Blogger Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data images || true
          git diff --staged --quiet || git commit -m "chore: update history, state and images [skip ci]"
          git pull --rebase || true
          git push || true
